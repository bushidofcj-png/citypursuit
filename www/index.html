function mgRoofInit(){const m=MN;m.roofs=[{x0:0,w:260,h:150,i:0}];m.cl=[];m.last=0;m.perf=0;

function mgRoofGen(){const m=MN;
 while(m.roofs[m.roofs.length-1].x0<m.p.x+1500){const r=m.roofs[m.roofs.length-1],n=r.i+1,gap=rnd(80,Math.min(330,110+n*7)),w=rnd(Math.max(80,200-n*4),Math.max(115,250-n*3)),h=cl(r.h+rnd(-55,55),90,230);
  const nr={x0:r.x0+r.w+gap,w,h,i:n};m.roofs.push(nr);
  if(Math.random()<.7){const c0=r.x0+r.w+gap/2;for(let k=-1;k<=1;k++)m.cl.push({x:c0+k*28,y:Math.max(r.h,h)+70+(1-Math.abs(k))*22})}}
 m.roofs=m.roofs.filter(r=>r.x0+r.w>m.p.x-900);m.cl=m.cl.filter(c=>!c.got&&c.x>m.p.x-900)}
function mgRoofUpd(dt){const m=MN,p=m.p,rt=K.KeyD,lf=K.KeyA,sp=K.Space,dir=(rt?1:0)-(lf?1:0);
 m.cx+=(p.x-260-m.cx)*Math.min(1,6*dt);mgRoofGen();
 if(p.st=='idle'||p.st=='charge'){
  if(p.st=='idle'&&dir){p.x+=dir*110*dt;p.f=dir;p.ph+=dt*8}
  if(sp){p.st='charge';p.pw=Math.min(1,p.pw+dt*.95)}
  else if(p.st=='charge'){p.st='air';p.vx=100+p.pw*360;p.vy=520;p.at=0;p.f=1;snd('jump');mgP(p.x,-(p.y)+RBY,'#c9c9c9',6);p.pw=0}
  const r=p.r;if(p.x<r.x0-6||p.x>r.x0+r.w+6){p.st='air';p.vx=Math.max(0,dir*60);p.vy=0;p.at=0}
 }
 else if(p.st=='air'){
  const oy=p.y;p.vy-=1100*dt;p.y+=p.vy*dt;p.vx=cl(p.vx+dir*220*dt,0,540);p.x+=p.vx*dt;p.at+=dt;p.ph+=dt*10;
  for(const r of m.roofs){
   if(p.x>r.x0-4&&p.x<r.x0+r.w+4){
    if(p.vy<=0&&oy>=r.h-3&&p.y<=r.h){p.y=r.h;p.vy=0;p.vx=0;p.st='idle';p.r=r;snd('bonk');mgP(p.x,-(r.h)+RBY,'#c9c9c9',8);m.shk=3;
     if(r.i>m.last){m.last=r.i;const c=Math.abs(p.x-(r.x0+r.w/2));let pt=10;
      if(c<=11){m.perf++;pt+=20*Math.min(3,m.perf);mgT(p.x,RBY-r.h-70,'PERFECT x'+m.perf,'#7cf5c8')}else{m.perf=0;mgT(p.x,RBY-r.h-70,'+'+pt,'#ffd23f')}
      m.sc+=pt}
     break}
    else if(p.y<r.h-6&&p.x<r.x0+10&&p.vx>0){p.vx=-90;p.x=r.x0-5;m.shk=6;snd('crash')}}}
  if(p.y<-120)mgEnd('MISSED THE ROOF!')}
 for(const c of m.cl)if(!c.got&&Math.abs(p.x-c.x)<20&&Math.abs(p.y+28-c.y)<32){c.got=1;m.coins++;m.sc+=5;snd('coin');mgP(c.x,RBY-c.y,'#ffd166',3)}
}
